{% extends 'base.html' %}
{% block content %}

<style>

/* PAGE CENTER */

.settings-wrapper{
display:flex;
justify-content:center;
align-items:center;
min-height:80vh;
}

/* CARD */

.settings-card{

width:480px;
padding:50px 35px;

background:linear-gradient(145deg,#1e293b,#0f172a);

border-radius:22px;

position:relative;

box-shadow:

0 0 35px rgb(3, 167, 238);

}

/* 🔵 INNER SKY BLUE BORDER */

.settings-card::before{

content:"";

position:absolute;

top:15px;
left:15px;
right:15px;
bottom:15px;

border-radius:18px;

border:2px solid #38bdf8;

pointer-events:none;

}

/* TITLE */

.settings-title{

font-size:28px;
font-weight:600;

margin-bottom:25px;

background:linear-gradient(90deg,#38bdf8,#6366f1,#22c55e);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

/* SETTINGS LINK (same style as sidebar) */

.settings-link{

display:flex;
align-items:center;
gap:14px;

padding:12px 20px;
margin:10px 0;

color:#cbd5e1;
text-decoration:none;

font-size:15px;
font-weight:500;

border-radius:12px;

transition:all 0.3s ease;

background:rgba(255,255,255,0.02);

}

/* ICON bubble */

.settings-link i{

width:36px;
height:36px;

display:flex;
align-items:center;
justify-content:center;

font-size:16px;

border-radius:10px;

background:rgba(255,255,255,0.06);

transition:0.3s ease;

}

/* Hover effect (same as sidebar) */

.settings-link:hover{

background:linear-gradient(90deg, rgba(56,189,248,0.2), rgba(99,102,241,0.2));

transform:translateX(6px);

color:white;

box-shadow:0 8px 20px rgba(0,0,0,0.4);

}

.settings-link:hover i{

background:linear-gradient(135deg,#38bdf8,#6366f1);

color:white;

transform:scale(1.1);

}

</style>


<div class="settings-wrapper">

<div class="settings-card">




<a href="{% url 'insights' %}" class="settings-link">
<i class="bi bi-graph-up-arrow"></i>
Insights
</a>


<a href="{% url 'edit_profile' %}" class="settings-link">
<i class="bi bi-person-gear"></i>
Edit Profile
</a>

<a href="{% url 'change_password' %}" class="settings-link">
    <i class="bi bi-key"></i>
    Change Password
</a>

<a href="javascript:void(0)" onclick="toggleTheme()" class="settings-link">
    <i id="themeIcon" class="bi bi-moon-stars"></i>
    Toggle Theme
</a>

</div>

</div>

{% endblock %}
