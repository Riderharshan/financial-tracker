{% extends 'base.html' %}

{% block content %}

<style>

/* PAGE */

.insights-container{
max-width:1300px;
margin:auto;
margin-top:40px;
padding-bottom:60px;
}

/* GRID LAYOUT */

.analytics-grid{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:30px;

}

/* CARD */

.analytics-card{

position:relative;

background:linear-gradient(145deg,#1e293b,#0f172a);

padding:25px;

border-radius:18px;

box-shadow:
0 15px 15px rgba(0,0,0,0.8);

transition:0.35s;

}

/* Inner sky blue border */

.analytics-card::before{

content:"";

position:absolute;

top:10px;
left:10px;
right:10px;
bottom:10px;

border:2px solid #00cbf9fc;   /* sky blue */

border-radius:14px;

pointer-events:none;



}


.analytics-card:hover{

transform:translateY(-6px);

box-shadow:

0 0 35px rgb(0, 179, 255);

}

.analytics-card h3{

color:white;
font-weight:600;
margin-bottom:20px;

}

/* CHART HEIGHT */

.analytics-card canvas{
width:100%;
max-height:260px;
}

/* MOBILE */

@media(max-width:900px){

.analytics-grid{
grid-template-columns:1fr;
}

}

.category-dropdown{
margin-bottom:18px;
display:flex;
align-items:center;
gap:12px;
}

.category-dropdown label{
color:#e2e8f0;
font-weight:600;
font-size:14px;
letter-spacing:0.5px;
}

/* Dropdown Styling */

#comparisonSelector{

background:linear-gradient(145deg,#1e293b,#0f172a);
color:#e2e8f0;

border:1px solid #334155;
border-radius:10px;

padding:8px 14px;

font-size:14px;
font-weight:500;

outline:none;
cursor:pointer;

/* floating effect */
box-shadow:0 6px 16px rgba(0,0,0,0.35);

transition:all 0.25s ease;
}


/* Hover floating animation */

#comparisonSelector:hover{

transform:translateY(-2px);

box-shadow:
0 10px 24px rgba(0,0,0,0.45),
0 0 0 1px rgba(59,130,246,0.25);

}


/* Click effect */

#comparisonSelector:focus{

border-color:#3b82f6;

box-shadow:
0 0 0 2px rgba(59,130,246,0.25),
0 10px 24px rgba(0,0,0,0.45);

}


/* Dropdown options */

#comparisonSelector option{

background:#0f172a;
color:#e2e8f0;

}

#budgetGauge{
display:block;
margin:auto;
max-width:420px;
}

.analytics-card canvas{
margin-top:20px;
}

.budget-progress-card{
margin-top:20px;
}

.budget-bar{
height:12px;
background:#374151;
border-radius:10px;
overflow:hidden;
margin-top:10px;
}

.budget-fill{
height:100%;
background:linear-gradient(90deg,#22c55e,#facc15,#ef4444);
width:0%;
transition:width 0.6s ease;
}

.budget-percent{
margin-top:8px;
font-size:14px;
color:#cbd5f5;
}

/* Budget dropdown container */

.budget-dropdown{

display:flex;
align-items:center;
gap:12px;

margin-bottom:20px;

}

/* Label */

.budget-dropdown label{

color:#e2e8f0;
font-size:14px;
font-weight:600;
letter-spacing:0.4px;

}

/* Dropdown style */

#budgetMonth{

appearance:none;

background:linear-gradient(145deg,#1e293b,#0f172a);

color:#e2e8f0;

border:1px solid #334155;

border-radius:10px;

padding:8px 16px;

font-size:14px;
font-weight:500;

cursor:pointer;

/* floating shadow */

box-shadow:
0 8px 18px rgba(0,0,0,0.45);

transition:all 0.25s ease;

}

/* Hover floating */

#budgetMonth:hover{

transform:translateY(-2px);

box-shadow:
0 12px 26px rgba(0,0,0,0.6),
0 0 0 1px rgba(56,189,248,0.25);

}

/* Focus glow */

#budgetMonth:focus{

outline:none;

border-color:#38bdf8;

box-shadow:
0 0 0 2px rgba(56,189,248,0.25),
0 12px 26px rgba(0,0,0,0.6);

}

/* Dropdown options */

#budgetMonth option{

background:#0f172a;
color:#e2e8f0;

}

/* Floating dropdown container */

#expensePieMonth{

appearance:none;
-webkit-appearance:none;
-moz-appearance:none;

background:linear-gradient(145deg,#1e293b,#0f172a);

color:#e2e8f0;

border:1px solid #334155;

border-radius:12px;

padding:10px 36px 10px 16px;

font-size:14px;
font-weight:500;

cursor:pointer;

/* floating glass effect */

box-shadow:
0 10px 22px rgba(0,0,0,0.45),
0 0 0 1px rgba(59,130,246,0.15);

transition:all 0.25s ease;

position:relative;

}

/* Hover floating effect */

#expensePieMonth:hover{

transform:translateY(-2px);

box-shadow:
0 14px 28px rgba(0,0,0,0.55),
0 0 0 1px rgba(56,189,248,0.35);

}

/* Focus glow */

#expensePieMonth:focus{

outline:none;

border-color:#38bdf8;

box-shadow:
0 0 0 2px rgba(56,189,248,0.25),
0 14px 28px rgba(0,0,0,0.55);

}

/* Dropdown options */

#expensePieMonth option{

background:#0f172a;
color:#e2e8f0;

}
/* Weekly Month Dropdown */

#weeklyMonth{

appearance:none;
-webkit-appearance:none;
-moz-appearance:none;

background:linear-gradient(145deg,#1e293b,#0f172a);

color:#e2e8f0;

border:1px solid #334155;

border-radius:12px;

padding:10px 36px 10px 16px;

font-size:14px;
font-weight:500;

cursor:pointer;

/* floating glass effect */

box-shadow:
0 10px 22px rgba(0,0,0,0.45),
0 0 0 1px rgba(59,130,246,0.15);

transition:all 0.25s ease;

position:relative;

}


/* Hover Floating Animation */

#weeklyMonth:hover{

transform:translateY(-2px);

box-shadow:
0 14px 28px rgba(0,0,0,0.55),
0 0 0 1px rgba(56,189,248,0.35);

}


/* Focus Glow */

#weeklyMonth:focus{

outline:none;

border-color:#38bdf8;

box-shadow:
0 0 0 2px rgba(56,189,248,0.25),
0 14px 28px rgba(0,0,0,0.55);

}


/* Dropdown options */

#weeklyMonth option{

background:#0f172a;
color:#e2e8f0;

}
/* Category Monthly Trend Dropdown */

#categoryMonthSelector{

appearance:none;
-webkit-appearance:none;
-moz-appearance:none;

background:linear-gradient(145deg,#1e293b,#0f172a);

color:#e2e8f0;

border:1px solid #334155;

border-radius:12px;

padding:10px 36px 10px 16px;

font-size:14px;
font-weight:500;

cursor:pointer;

/* floating glass effect */

box-shadow:
0 10px 22px rgba(0,0,0,0.45),
0 0 0 1px rgba(59,130,246,0.15);

transition:all 0.25s ease;

position:relative;

}


/* Hover floating effect */

#categoryMonthSelector:hover{

transform:translateY(-2px);

box-shadow:
0 14px 28px rgba(0,0,0,0.55),
0 0 0 1px rgba(56,189,248,0.35);

}


/* Focus glow */

#categoryMonthSelector:focus{

outline:none;

border-color:#38bdf8;

box-shadow:
0 0 0 2px rgba(56,189,248,0.25),
0 14px 28px rgba(0,0,0,0.55);

}


/* Dropdown options */

#categoryMonthSelector option{

background:#0f172a;
color:#e2e8f0;

}
</style>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

const ctx = document.getElementById('savingsTrend').getContext('2d');

/* Gradient Color */
const gradient = ctx.createLinearGradient(0, 0, 0, 400);
gradient.addColorStop(0, 'rgba(34,197,94,0.6)');
gradient.addColorStop(1, 'rgba(34,197,94,0.05)');

new Chart(ctx, {
    type: 'line',

    data: {
        labels: JSON.parse('{{ months|escapejs }}'),
        datasets: [{
            label: 'Savings',
            data: JSON.parse('{{ savings|escapejs }}'),

            borderColor: '#22c55e',
            backgroundColor: gradient,
            borderWidth: 3,

            fill: true,
            tension: 0.45,

            pointBackgroundColor: '#22c55e',
            pointBorderColor: '#ffffff',
            pointBorderWidth: 2,
            pointRadius: 5,
            pointHoverRadius: 9,
            pointHoverBackgroundColor: '#16a34a',
        }]
    },

    options: {

        responsive: true,

        interaction: {
            mode: 'index',
            intersect: false
        },

        plugins: {
            legend: {
                labels: {
                    color: "#e5e7eb",
                    font: {
                        size: 14,
                        weight: 'bold'
                    }
                }
            },

            tooltip: {
                backgroundColor: "#0f172a",
                titleColor: "#ffffff",
                bodyColor: "#22c55e",
                borderColor: "#22c55e",
                borderWidth: 1,
                padding: 12,
                cornerRadius: 8
            }
        },

        scales: {
            x: {
                grid: {
                    color: "rgba(255,255,255,0.05)"
                },
                ticks: {
                    color: "#cbd5f5",
                    font: { size: 12 }
                }
            },

            y: {
                grid: {
                    color: "rgba(255,255,255,0.05)"
                },
                ticks: {
                    color: "#cbd5f5",
                    font: { size: 12 }
                }
            }
        },

        animation: {
            duration: 2000,
            easing: 'easeOutQuart'
        }
    }
});


/* -------- 2 Expense Category Trend -------- */

const ctx2 = document.getElementById('categoryTrend').getContext('2d');

/* DATA FROM DJANGO */
const months = JSON.parse('{{ months|escapejs }}');

const foodData = JSON.parse('{{ food_trend|escapejs }}');
const fuelData = JSON.parse('{{ fuel_trend|escapejs }}');
const billsData = JSON.parse('{{ bills_trend|escapejs }}');

const groceriesData = JSON.parse('{{ groceries_trend|escapejs }}');
const personalCareData = JSON.parse('{{ personal_care_trend|escapejs }}');

const transportData = JSON.parse('{{ transport_trend|escapejs }}');
const travelData = JSON.parse('{{ travel_trend|escapejs }}');

const rentData = JSON.parse('{{ rent_trend|escapejs }}');
const internetData = JSON.parse('{{ internet_trend|escapejs }}');
const loanData = JSON.parse('{{ loan_trend|escapejs }}');

const shoppingData = JSON.parse('{{ shopping_trend|escapejs }}');
const entertainmentData = JSON.parse('{{ entertainment_trend|escapejs }}');

const healthData = JSON.parse('{{ health_trend|escapejs }}');
const educationData = JSON.parse('{{ education_trend|escapejs }}');

const bikeServiceData = JSON.parse('{{ bike_service_trend|escapejs }}');


/* DATASETS */

const datasets = {

food:{
label:'Food',
data:foodData,
borderColor:'#f97316',
borderWidth:3,
tension:0.45
},

fuel:{
label:'Fuel / Petrol',
data:fuelData,
borderColor:'#3b82f6',
borderWidth:3,
tension:0.45
},

bills:{
label:'Bills',
data:billsData,
borderColor:'#ef4444',
borderWidth:3,
tension:0.45
},

groceries:{
label:'Groceries',
data:groceriesData,
borderColor:'#10b981',
borderWidth:3,
tension:0.45
},

personal_care:{
label:'Personal Care',
data:personalCareData,
borderColor:'#a855f7',
borderWidth:3,
tension:0.45
},

transport:{
label:'Transport',
data:transportData,
borderColor:'#6366f1',
borderWidth:3,
tension:0.45
},

travel:{
label:'Travel',
data:travelData,
borderColor:'#f59e0b',
borderWidth:3,
tension:0.45
},

rent:{
label:'Rent / Housing',
data:rentData,
borderColor:'#22c55e',
borderWidth:3,
tension:0.45
},

internet:{
label:'Internet / Mobile Recharge',
data:internetData,
borderColor:'#06b6d4',
borderWidth:3,
tension:0.45
},

loan:{
label:'Loan',
data:loanData,
borderColor:'#e11d48',
borderWidth:3,
tension:0.45
},

shopping:{
label:'Shopping',
data:shoppingData,
borderColor:'#ec4899',
borderWidth:3,
tension:0.45
},

entertainment:{
label:'Entertainment',
data:entertainmentData,
borderColor:'#84cc16',
borderWidth:3,
tension:0.45
},

health:{
label:'Health / Medical',
data:healthData,
borderColor:'#14b8a6',
borderWidth:3,
tension:0.45
},

education:{
label:'Education',
data:educationData,
borderColor:'#9333ea',
borderWidth:3,
tension:0.45
},

bike_service:{
label:'Bike Service',
data:bikeServiceData,
borderColor:'#f97316',
borderWidth:3,
tension:0.45
}

};


/* CREATE CHART */

const categoryChart = new Chart(ctx2,{
type:'line',
data:{
labels:months,
datasets:[
datasets.food,
datasets.groceries,
datasets.personal_care
]
},

options:{

responsive:true,

interaction:{
mode:'index',
intersect:false
},

plugins:{

tooltip:{
backgroundColor:'#0f172a',
titleColor:'#ffffff',
bodyColor:'#e2e8f0',
borderColor:'#334155',
borderWidth:1,
padding:12,
cornerRadius:8,
displayColors:true,

callbacks:{

title:function(context){
return "Month : " + context[0].label;
},

label:function(context){

let value = context.raw;

if(value === 0){
return context.dataset.label + " : ₹0";
}

return context.dataset.label + " : ₹" + value.toLocaleString();

}

}

}

}

}

});


/* DROPDOWN LOGIC */

document.getElementById("comparisonSelector").addEventListener("change",function(){

let selected = this.value;

if(selected === "food_group"){
categoryChart.data.datasets = [
datasets.food,
datasets.groceries,
datasets.personal_care
];
}

if(selected === "transport_group"){
categoryChart.data.datasets = [
datasets.transport,
datasets.fuel,
datasets.travel
];
}

if(selected === "housing_group"){
categoryChart.data.datasets = [
datasets.rent,
datasets.internet,
datasets.loan
];
}

if(selected === "lifestyle_group"){
categoryChart.data.datasets = [
datasets.shopping,
datasets.entertainment,
datasets.travel
];
}

if(selected === "health_group"){
categoryChart.data.datasets = [
datasets.health,
datasets.education,
datasets.personal_care
];
}

if(selected === "vehicle_group"){
categoryChart.data.datasets = [
datasets.fuel,
datasets.bike_service,
datasets.transport
];
}

categoryChart.update();

});

/* -------- 3 Budget Utilization -------- */

const monthlyExpense = JSON.parse('{{ expense_data|escapejs }}');
const budgetLimits = JSON.parse('{{ budget_limits|escapejs }}');

const gaugeCtx = document.getElementById('budgetGauge').getContext('2d');

let gaugeChart;

/* Gradient colors */
const usedGradient = gaugeCtx.createLinearGradient(0,0,0,200);
usedGradient.addColorStop(0,'#ff6b6b');
usedGradient.addColorStop(1,'#ef4444');

const remainGradient = gaugeCtx.createLinearGradient(0,0,0,200);
remainGradient.addColorStop(0,'#34d399');
remainGradient.addColorStop(1,'#22c55e');


/* Center text plugin */
const centerText = {
id:'centerText',
afterDraw(chart){

const {ctx} = chart;
const data = chart.data.datasets[0].data;

const used = data[0];
const remaining = data[1];
const total = used + remaining;

const percent = total === 0 ? 0 : Math.round((used/total)*100);

ctx.save();

ctx.font="bold 34px Inter";
ctx.fillStyle="#e2e8f0";
ctx.textAlign="center";
ctx.textBaseline="middle";

ctx.fillText(percent+"%", chart.width/2, chart.height/1.25);

ctx.font="14px Inter";
ctx.fillStyle="#94a3b8";

ctx.fillText("Budget Used", chart.width/2, chart.height/1.15);

ctx.restore();

}
};


function updateGauge(month){

const used = monthlyExpense[month] || 0;
const limit = budgetLimits[month] || 0;

const remaining = Math.max(limit - used,0);

const percent = limit === 0 ? 0 : (used/limit)*100;

document.getElementById("budgetText").innerText =
`₹${used} spent of ₹${limit} (${percent.toFixed(0)}%)`;

const data = [used,remaining];

if(gaugeChart){

gaugeChart.data.datasets[0].data = data;
gaugeChart.update();

return;

}

gaugeChart = new Chart(gaugeCtx,{

type:'doughnut',

data:{
datasets:[{

data:data,

backgroundColor:[
usedGradient,
remainGradient
],

borderWidth:0,
hoverOffset:10

}]
},

options:{

rotation:-90,
circumference:180,
cutout:'70%',

responsive:true,

plugins:{

legend:{display:false},

tooltip:{
backgroundColor:"#0f172a",
titleColor:"#fff",
bodyColor:"#e2e8f0",
borderColor:"#334155",
borderWidth:1,
padding:12,
callbacks:{
label:function(context){
return context.raw.toLocaleString();
}
}
}

},

animation:{
duration:1500,
easing:'easeOutQuart'
}

},

plugins:[centerText]

});

}


/* ALWAYS START WITH JANUARY */

const currentMonth = 0;

document.getElementById("budgetMonth").value = 0;

updateGauge(currentMonth);


/* DROPDOWN CHANGE */

document.getElementById("budgetMonth").addEventListener("change",function(){

const month = parseInt(this.value);

updateGauge(month);

});

/* -------- 4 Expense Distribution -------- */

const pieCtx = document.getElementById('incomeExpenseRatio').getContext('2d');

const categoryMonthData = JSON.parse('{{ category_month_data|escapejs }}');

let pieChart;

/* Modern color palette */

const pieColors = [
'#4f46e5','#22c55e','#f97316','#ef4444','#eab308',
'#06b6d4','#8b5cf6','#ec4899','#10b981','#6366f1',
'#14b8a6','#84cc16','#f43f5e','#9333ea','#0284c7'
];


/* Soft shadow */

const pieShadow = {

id:'pieShadow',

beforeDatasetDraw(chart){

const ctx = chart.ctx;

ctx.save();
ctx.shadowColor = "rgba(0,0,0,0.35)";
ctx.shadowBlur = 25;
ctx.shadowOffsetY = 8;

},

afterDatasetDraw(chart){
chart.ctx.restore();
}

};


/* Center Text Plugin */

const pieCenterText = {

id:'centerText',

afterDraw(chart){

const {ctx} = chart;
const data = chart.data.datasets[0].data;

if(!data.length) return;

const total = data.reduce((a,b)=>a+b,0);

ctx.save();

ctx.font="bold 18px Inter";
ctx.fillStyle="#e2e8f0";
ctx.textAlign="center";
ctx.textBaseline="middle";

ctx.fillText("Total", chart.width/2, chart.height/2 - 12);

ctx.font="bold 28px Inter";
ctx.fillStyle="#22c55e";

ctx.fillText("₹"+total.toLocaleString(), chart.width/2, chart.height/2 + 18);

ctx.restore();

}

};


/* Get data based on month */

function getPieData(month){

let labels = [];
let data = [];

Object.keys(categoryMonthData).forEach(cat=>{

let values = categoryMonthData[cat];
let amount = 0;

if(month === "all"){
amount = values.reduce((a,b)=>a+b,0);
}else{
amount = values[month] || 0;
}

if(amount > 0){

labels.push(cat);
data.push(amount);

}

});

return {labels,data};

}
