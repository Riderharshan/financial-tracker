{% extends 'base.html' %}
{% block content %}

<style>

/* PAGE CENTER */

.edit-wrapper{
display:flex;
justify-content:center;
align-items:center;
min-height:85vh;
}


/* CARD */

.edit-card{

width:520px;

padding:50px 45px;

background:linear-gradient(145deg,#1e293b,#0f172a);

border-radius:26px;

position:relative;

/* floating glow */

box-shadow:

0 0 35px rgb(0, 179, 255);

transition:0.35s;

}

/* hover floating */

.edit-card:hover{

transform:translateY(-6px);

box-shadow:
0 40px 90px rgba(0,0,0,0.9),
0 0 55px rgba(56,189,248,0.55);

}


/* SKY BLUE INNER BORDER */

.edit-card::before{

content:"";

position:absolute;

top:14px;
left:14px;
right:14px;
bottom:14px;

border-radius:20px;

border:2px solid rgba(56,189,248,0.85);

pointer-events:none;

}


/* TITLE */

.edit-title{

text-align:center;

font-size:32px;

font-weight:600;

margin-bottom:35px;

background:linear-gradient(90deg,#38bdf8,#6366f1,#22c55e);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}


/* FORM GROUP */

.form-group{
margin-bottom:22px;
}


/* LABEL */

.form-group label{

display:block;

margin-bottom:6px;

font-weight:500;

color:#cbd5f5;

}


/* INPUT */

.form-control{

width:100%;

padding:12px 14px;

border-radius:12px;

border:1px solid #334155;

background:#0f172a;

color:white;

transition:0.3s;

}


/* INPUT FOCUS */

.form-control:focus{

outline:none;

border-color:#38bdf8;

box-shadow:
0 0 0 2px rgba(56,189,248,0.35);

}


/* FILE INPUT */

input[type="file"]{

padding:8px;

background:#0f172a;

color:white;

}


/* SAVE BUTTON */

.save-btn{

margin-top:20px;

width:100%;

padding:14px;

border:none;

border-radius:14px;

font-size:16px;

font-weight:600;

color:white;

cursor:pointer;

background:linear-gradient(135deg,#38bdf8,#6366f1);

transition:0.3s;

box-shadow:
0 10px 25px rgba(0,0,0,0.6),
0 0 15px rgba(56,189,248,0.5);

}


/* BUTTON HOVER */

.save-btn:hover{

transform:translateY(-2px);

background:linear-gradient(135deg,#6366f1,#38bdf8);

box-shadow:
0 15px 35px rgba(0,0,0,0.7),
0 0 25px rgba(56,189,248,0.8);

}

/* FILE UPLOAD */

.file-upload-wrapper{

display:flex;
align-items:center;
gap:15px;

}

/* hide default input */

.upload-btn input{
display:none;
}

/* custom button */

.upload-btn{

display:flex;
align-items:center;
gap:8px;

padding:10px 18px;

border-radius:12px;

cursor:pointer;

font-weight:500;

color:white;

background:linear-gradient(135deg,#38bdf8,#6366f1);

box-shadow:
0 8px 20px rgba(0,0,0,0.6),
0 0 12px rgba(56,189,248,0.5);

transition:0.3s;

}

/* hover */

.upload-btn:hover{

transform:translateY(-2px);

background:linear-gradient(135deg,#6366f1,#38bdf8);

box-shadow:
0 12px 28px rgba(0,0,0,0.7),
0 0 18px rgba(56,189,248,0.8);

}

/* file name */

#fileName{
color:#cbd5f5;
font-size:14px;
}

</style>



<div class="edit-wrapper">

<div class="edit-card">

<h2 class="edit-title">Edit Profile</h2>

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

<div class="form-group">
<label>Username</label>
<input type="text" name="username"
value="{{ request.user.username }}"
class="form-control"
required>
</div>

<div class="form-group">
<label>Email</label>
<input type="email" name="email"
value="{{ request.user.email }}"
class="form-control"
required>
</div>

<div class="form-group">
<label>Phone Number</label>
<input type="text" name="phone_number"
value="{{ profile.phone_number }}"
class="form-control">
</div>

<div class="form-group">

<label>Profile Picture</label>

<div class="file-upload-wrapper">

<label class="upload-btn">
<i class="bi bi-cloud-arrow-up"></i>
Upload Photo
<input type="file" name="profile_image" id="fileUpload">
</label>


</div>

</div>

<button type="submit" class="save-btn">
Save Changes
</button>

</form>

</div>

</div>

{% endblock %}
