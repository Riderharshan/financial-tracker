{% extends 'base.html' %}

{% block content %}

<style>

/* MAIN LAYOUT */

.income-layout{
display:flex;
align-items:center;
justify-content:center;

gap:80px;

max-width:1000px;
margin:70px auto;

padding:20px;
flex-wrap:wrap;
}

/* ANIMATION */

.income-animation{
flex:1;
display:flex;
justify-content:center;
align-items:center;
min-width:320px;
}

/* BIGGER ANIMATION */

.income-animation dotlottie-wc{
width:320px;
height:320px;
}

/* FORM */

.form-container {
flex:1;
max-width:450px;

background: linear-gradient(145deg, #1e293b, #0f172a);
padding: 35px;
border-radius: 20px;

box-shadow:
0 20px 60px rgba(0,0,0,0.7),
inset 0 1px 0 rgba(255,255,255,0.05);

transition:0.3s;
}

.form-container:hover{
transform:translateY(-5px);
}

/* TITLE */

.form-title {
color: white;
font-size: 28px;
font-weight: 600;
margin-bottom: 25px;
text-align: center;
}

/* LABELS */

.form-label {
color: #94a3b8;
font-weight: 500;
margin-bottom: 6px;
display: block;
}

/* INPUTS */

.form-input {
width: 100%;
padding: 10px 14px;
margin-bottom: 18px;
border-radius: 10px;
border: 1px solid #334155;
background-color: #0f172a;
color: white;
transition: 0.3s;
}

/* INPUT FOCUS */

.form-input:focus {
border-color: #22c55e;
outline: none;
box-shadow: 0 0 10px rgba(34,197,94,0.6);
}

/* BUTTON */

.btn-save {
width: 100%;
padding: 12px;
border-radius: 12px;
border: none;

background: linear-gradient(90deg, #22c55e, #16a34a);

color: white;
font-weight: 600;
font-size: 16px;

transition: 0.3s;
}

.btn-save:hover {
transform: translateY(-2px);
box-shadow: 0 5px 15px rgba(34,197,94,0.5);
}

</style>


<div class="income-layout">

<!-- LEFT SIDE ANIMATION -->

<div class="income-animation">

<script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.3/dist/dotlottie-wc.js" type="module"></script>

<dotlottie-wc
src="https://lottie.host/6ff3e2ce-279c-4d69-a3af-28d85182a6e1/WBW5FOW84h.lottie"
autoplay
loop>
</dotlottie-wc>

</div>


<!-- RIGHT SIDE FORM -->

<div class="form-container">

<div class="form-title">Add Income</div>

<form method="POST">
{% csrf_token %}

<label class="form-label">Amount</label>
<input type="number" name="amount" class="form-input" required>

<label class="form-label">Category</label>

<select name="category" class="form-input" required>

<option value="">Select Category</option>

<option>Salary</option>
<option>Freelance / Side Income</option>
<option>Business Income</option>
<option>Bonus / Incentives</option>
<option>Interest (Bank Interest)</option>
<option>Investment Returns / Dividends</option>
<option>Rental Income</option>
<option>Gift Received</option>
<option>Refund / Cashback</option>
<option>Other Income</option>

</select>

<label class="form-label">Date</label>
<input type="date" name="date" class="form-input" required>

<button type="submit" class="btn-save">
<i class="bi bi-check-circle me-1"></i>
Save Income
</button>

</form>

</div>

</div>

{% endblock %}
