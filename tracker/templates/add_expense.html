{% extends 'base.html' %}

{% block content %}

<style>

/* MAIN LAYOUT */

.expense-layout{

display:flex;
align-items:center;
justify-content:center;

gap:80px;

max-width:1000px;
margin:70px auto;

padding:20px;
flex-wrap:wrap;

}

/* ANIMATION */

.expense-animation{
flex:1;
display:flex;
justify-content:center;
align-items:center;
min-width:320px;
}

/* Bigger animation */

.expense-animation dotlottie-wc{
width:520px;
height:520px;
}

/* FORM CONTAINER */

.form-container {

flex:1;
max-width:450px;

background: linear-gradient(145deg, #1e293b, #0f172a);
padding: 35px;
border-radius: 20px;

box-shadow:
0 20px 60px rgba(0,0,0,0.7),
inset 0 1px 0 rgba(255,255,255,0.05);

transition:0.3s;

}

.form-container:hover{
transform:translateY(-5px);
}

/* TITLE */

.form-title {
color: white;
font-size: 28px;
font-weight: 600;
margin-bottom: 25px;
text-align: center;
}

/* LABELS */

.form-label {
color: #94a3b8;
font-weight: 500;
margin-bottom: 6px;
display: block;
}

/* INPUTS */

.form-input {
width: 100%;
padding: 10px 14px;
margin-bottom: 18px;
border-radius: 10px;
border: 1px solid #334155;
background-color: #0f172a;
color: white;
transition: 0.3s;
}

/* INPUT FOCUS */

.form-input:focus {
border-color: #ef4444;
outline: none;
box-shadow: 0 0 10px rgba(239,68,68,0.6);
}

/* BUTTON */

.btn-save {
width: 100%;
padding: 12px;
border-radius: 12px;
border: none;

background: linear-gradient(90deg, #ef4444, #dc2626);

color: white;
font-weight: 600;
font-size: 16px;

transition: 0.3s;
}

.btn-save:hover {
transform: translateY(-2px);
box-shadow: 0 5px 15px rgba(239,68,68,0.5);
}

</style>


<div class="expense-layout">

<!-- LEFT SIDE ANIMATION -->

<div class="expense-animation">

<script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.3/dist/dotlottie-wc.js" type="module"></script>

<dotlottie-wc
src="https://lottie.host/36d9bd9b-13c7-4b50-9a3c-53cf740a52ae/PABFITYMpU.lottie"
autoplay
loop>
</dotlottie-wc>

</div>


<!-- RIGHT SIDE FORM -->

<div class="form-container">

<div class="form-title">Add Expense</div>

<form method="POST">
{% csrf_token %}

<label class="form-label">Amount</label>
<input type="number" name="amount" class="form-input" required>

<label class="form-label">Category</label>

<select name="category" class="form-input" required>

<option value="">Select Category</option>

<option>Food</option>
<option>Groceries</option>
<option>Transport</option>
<option>Fuel / Petrol</option>
<option>Rent / Housing</option>
<option>Loan</option>
<option>Internet / Mobile Recharge</option>
<option>Shopping</option>
<option>Entertainment</option>
<option>Health / Medical</option>
<option>Education</option>
<option>Travel</option>
<option>Personal Care</option>
<option>Bike Service</option>
<option>Miscellaneous</option>

</select>

<label class="form-label">Date</label>
<input type="date" name="date" class="form-input" required>

<button type="submit" class="btn-save">
<i class="bi bi-check-circle me-1"></i>
Save Expense
</button>

</form>

</div>

</div>

{% endblock %}
